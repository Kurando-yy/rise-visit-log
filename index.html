<!-- ★2026-09-15 style.css を ★ここへ埋め込みました（司令承認）。
     ★理由：★CSSの取得が1回失敗すると .screen{display:none} が効かず、
     ★全画面が同時に出て ★どこでも押せる状態になり ★誤入力が起こりうるため。
     ★元の行： <link rel="stylesheet" href="style.css?v=20260914e">
     ★style.css は ★残してあります（★編集はそちらで行い、★このスクリプトで貼り直す）。
     ★貼り直し： scratchpad/inline_css.py -->
<style>
/*
 * RISE南関町 来店記録タブレット — スタイル
 *
 * ★ボタン最小タップ寸法（根拠）
 * Apple Human Interface Guidelines の推奨最小タップ領域は 44x44pt。
 * 本画面は「高齢のお客様が自分でタップする」（司令要件）ため、その目安の
 * 約3倍以上を確保する: 最小 高さ140px × 幅220px（--tap-min-height / --tap-min-width）。
 * 画面4（最大5択）でも auto-fit グリッドでこの最小値を割らずに
 * 1024x768 / 820x1180 の両方に収まることを確認済み（検証結果は報告参照）。
 */

:root {
  --tap-min-height: 140px;
  --tap-min-width: 220px;
  --gap: 24px;
  --color-bg: #fdfaf5;
  --color-primary: #2f6f4f;
  --color-primary-dark: #1f4d36;
  --color-text: #222;
  --color-border: #cfcfcf;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "YuGothic", sans-serif;
  /* iPadでのピンチズーム・ダブルタップズームによる誤操作を避ける */
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

.screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 32px;
  text-align: center;
}

.screen.active {
  display: flex;
}

.screen-title {
  font-size: clamp(1.8rem, 4vw, 3rem);
  margin-bottom: var(--gap);
  font-weight: 700;
}

.btn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(var(--tap-min-width), 1fr));
  gap: var(--gap);
  width: 100%;
  max-width: 900px;
}

.tap-btn {
  min-height: var(--tap-min-height);
  min-width: var(--tap-min-width);
  font-size: clamp(1.4rem, 3vw, 2.2rem);
  font-weight: 700;
  color: #fff;
  background: var(--color-primary);
  border: none;
  border-radius: 16px;
  padding: 16px 20px;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--color-primary-dark);
  transition: transform 0.05s ease, box-shadow 0.05s ease;
}

.tap-btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 0 var(--color-primary-dark);
}

.tap-btn:disabled {
  opacity: 0.5;
  cursor: default;
}

.menu-btn {
  background: #3a7d5c;
}

.price-display {
  font-size: clamp(3rem, 10vw, 6rem);
  font-weight: 900;
  margin: var(--gap) 0 calc(var(--gap) * 1.5) 0;
  color: var(--color-primary-dark);
}

.confirm-btn {
  min-height: calc(var(--tap-min-height) * 1.2);
  min-width: 320px;
  font-size: clamp(1.6rem, 4vw, 2.6rem);
}

/* ★2026-09-14: 「他のメニューを追加」。
   ★確定ボタンより ★目立たせない（押し間違えると1人が2人に分かれてしまうため、
   　迷った時は「これで確定」に手が向くようにする）。 */
.add-btn {
  min-height: var(--tap-min-height);
  min-width: 320px;
  font-size: clamp(1.2rem, 2.8vw, 1.8rem);
  background: #fff;
  color: var(--color-primary-dark);
  border: 3px solid var(--color-primary-dark);
  margin-bottom: var(--gap);
}

/* 選んだメニューの内訳（2つ以上選ばれた時だけ出る） */
.picked-list {
  list-style: none;
  margin: 0 0 var(--gap);
  padding: 0;
  text-align: left;
  display: inline-block;
}

.picked-item {
  font-size: clamp(1.1rem, 2.4vw, 1.6rem);
  font-weight: 700;
  padding: 4px 0;
  color: var(--color-primary-dark);
}

.hint {
  margin-top: var(--gap);
  color: #777;
  font-size: 1rem;
}

/*
 * 画面1上部の帯（最終入力 / 本日の客数 / 本日の売上）
 * ★お客様もこの画面を見る可能性があるため、控えめな見た目にしてある
 *   （タップ対象と紛れないよう、ボタン色は使わない・押せる見た目にしない）。
 */
#screen-1 {
  position: relative;
}

/* ★文字の大きさ・太さは「ご来店は？」（.screen-title）と同じにする（司令 2026-08-16）。
   小さくて読めない、という実機での指摘に合わせた。 */
.today-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  gap: 4px 40px;
  padding: 18px 20px;
  background: #f2ede4;
  border-bottom: 1px solid var(--color-border);
  font-size: clamp(1.8rem, 4vw, 3rem);
  font-weight: 700;
  line-height: 1.25;
  color: #555;
  pointer-events: none; /* 誤タップで操作を邪魔しない */
}

.today-cell {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  white-space: nowrap;
}

/* 見出し（最終入力／本日 入力済み）は、数字より一段だけ小さくする。
   同じ大きさだと、どれが数字か一目で分からなくなるため。 */
.today-label {
  font-size: 0.6em;
  font-weight: 700;
  color: #888;
}

.today-value {
  font-weight: 700;
  color: var(--color-primary-dark);
  font-variant-numeric: tabular-nums;
}

/* 取得できなかった時・未送信がある時。★数字を推測して出さないための表示 */
.today-alert {
  flex-basis: 100%;
  text-align: center;
  margin-top: 2px;
  font-size: 0.75em;   /* 帯が伸びすぎないよう、数字より少しだけ小さく */
  font-weight: 700;
  color: #a3341f;
}

.today-bar.is-closed .today-value {
  color: #888;
}

/*
 * 本日の一覧（司令 2026-08-16）
 * ★お客様の目にも入る画面なので、来店用のボタン（緑・特大）とは
 *   はっきり別物に見せる。押し間違いで一覧が開くのを避ける。
 */
.list-btn {
  position: absolute;
  top: 96px;      /* 帯の下 */
  right: 20px;
  min-height: 64px;
  padding: 12px 24px;
  font-size: clamp(1.1rem, 2vw, 1.5rem);
  font-weight: 700;
  color: var(--color-primary-dark);
  background: #fff;
  border: 2px solid var(--color-primary);
  border-radius: 12px;
  cursor: pointer;
}

.list-btn:active {
  background: #eef4f0;
}

.list-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 10;
}

.list-overlay[hidden] {
  display: none;
}

.list-panel {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-width: 900px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.list-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--color-border);
}

.list-title {
  font-size: clamp(1.4rem, 3vw, 2rem);
  font-weight: 700;
}

.list-close {
  min-width: 64px;
  min-height: 64px;
  font-size: 1.8rem;
  font-weight: 700;
  color: #444;
  background: #f0ece5;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.list-body {
  overflow: auto;
  padding: 8px 20px 20px;
  text-align: left;
}

.list-table {
  width: 100%;
  border-collapse: collapse;
  font-size: clamp(1rem, 2vw, 1.4rem);
  font-variant-numeric: tabular-nums;
}

.list-table th,
.list-table td {
  padding: 10px 8px;
  border-bottom: 1px solid #e6e1d8;
  white-space: nowrap;
}

.list-table th {
  font-size: 0.8em;
  color: #888;
  text-align: left;
  position: sticky;
  top: 0;
  background: #fff;
}

.list-table td.num {
  text-align: right;
}

.list-total {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 2px solid var(--color-border);
  font-size: clamp(1.2rem, 2.6vw, 1.8rem);
  font-weight: 700;
  text-align: right;
  color: var(--color-primary-dark);
}

.list-msg {
  padding: 24px 0;
  font-size: clamp(1.1rem, 2.2vw, 1.5rem);
  font-weight: 700;
  color: #a3341f;
  text-align: center;
}

/* 丸刈り・ロング加算の注記。金額が料金表と違って見える理由を、その行に添える */
.list-note {
  margin-left: 6px;
  font-size: 0.8em;
  color: #a3341f;
}

/* ★2026-09-14 確定直後のお礼画面。
   「戻るまでが長い」の正体は ★3秒間なにも変わらないことだった（司令ご指摘）。
   押した瞬間にここへ切り替えて、手ごたえを先に返す。 */
.thanks-mark {
  font-size: clamp(4rem, 14vw, 9rem);
  line-height: 1;
  color: var(--color-primary-dark);
  margin-bottom: var(--gap);
}

</style>
</head>
<body>

<!-- 画面1: ご来店は？
     ★上部の帯は「入力し忘れ防止」と「レジとの突合」のため（司令 2026-08-16）。
       数字はサーバ（GAS）が数えたものをそのまま出す。端末では数え直さない。
       通信できない時は数字を推測せず「取得できません」と出す。 -->
<section id="screen-1" class="screen">
  <div id="today-bar" class="today-bar">
    <div class="today-cell">
      <span class="today-label">最終入力</span>
      <span id="today-last" class="today-value">…</span>
    </div>
    <!-- ★見出しは「売上」ではなく「入力済み」。
         レジの数字と一致していない前提（司令 2026-08-16「すでに全日違ってる」）なので、
         これはレジの売上ではなく "この画面から入力された分" だと分かる語にする。 -->
    <div class="today-cell">
      <span class="today-label">本日 入力済み</span>
      <span id="today-count" class="today-value">…</span>
      <span id="today-amount" class="today-value">…</span>
    </div>
    <div id="today-alert" class="today-alert" hidden></div>
  </div>
  <!-- ★本日の一覧（司令 2026-08-16）。レジとの突合に使う。
       帯は pointer-events:none なので、押せるのはこのボタンだけ。 -->
  <button id="btn-today-list" type="button" class="list-btn">本日の一覧</button>
  <div class="screen-title">ご来店は？</div>
  <div class="btn-grid">
    <button id="btn-first" type="button" class="tap-btn">初めて</button>
    <button id="btn-repeat" type="button" class="tap-btn">2回目以降</button>
  </div>
</section>

<!-- 画面2: 性別 -->
<section id="screen-2" class="screen">
  <div class="screen-title">性別</div>
  <div class="btn-grid">
    <button id="btn-men" type="button" class="tap-btn">男性</button>
    <button id="btn-woman" type="button" class="tap-btn">女性</button>
  </div>
</section>

<!-- 画面3: ご希望 -->
<section id="screen-3" class="screen">
  <div class="screen-title">本日のご希望</div>
  <div class="btn-grid">
    <button id="btn-section-cut" type="button" class="tap-btn">カット</button>
    <button id="btn-section-color" type="button" class="tap-btn">カラー</button>
    <button id="btn-section-perma" type="button" class="tap-btn">パーマ</button>
  </div>
</section>

<!-- 画面4: 詳しく（性別×区分で絞り込んだ一覧。JSで動的に生成） -->
<section id="screen-4" class="screen">
  <div class="screen-title">詳しく</div>
  <div id="screen-4-buttons" class="btn-grid"></div>
</section>

<!-- 画面4b: 丸刈り該当時のみ -->
<section id="screen-4b" class="screen">
  <div class="screen-title">仕上がりは？</div>
  <div class="btn-grid">
    <button id="btn-kari-normal" type="button" class="tap-btn">ふつう</button>
    <button id="btn-kari-kari" type="button" class="tap-btn">丸刈り</button>
  </div>
</section>

<!-- 画面4c: ロング加算(hasLong)該当時のみ。画面4bとは互いに排他だが、
     両方立った場合でも壊れないよう 4b→4c の順で表示する（app.js参照） -->
<section id="screen-4c" class="screen">
  <div class="screen-title">髪の長さは？</div>
  <div class="btn-grid">
    <button id="btn-long-normal" type="button" class="tap-btn">ふつう</button>
    <button id="btn-long-long" type="button" class="tap-btn">長い（＋600円）</button>
  </div>
</section>

<!-- 画面5: 確定
     ★2026-09-14（司令ご依頼）: 1人のお客様がカットとカラーを両方選べるようにする。
       「他のメニューを追加」で画面3（ご希望）へ戻り、選び終えたら合計で確定する。
       ★ご来店・性別は聞き直さない（同じお客様なので）。 -->
<section id="screen-5" class="screen">
  <div class="screen-title">お会計</div>
  <!-- 選んだメニューの内訳。1つだけの時は出さない（今までの見た目のまま） -->
  <ul id="screen-5-items" class="picked-list" hidden></ul>
  <div id="screen-5-price" class="price-display">0 円です</div>
  <button id="btn-add-menu" type="button" class="tap-btn add-btn">他のメニューを追加</button>
  <button id="btn-confirm" type="button" class="tap-btn confirm-btn">これで確定</button>
  <div class="hint">確定後、自動的に最初の画面へ戻ります</div>
</section>

<!-- 確定直後のお礼（★2026-09-14 司令ご依頼「戻るまでが異様に長い」）
     ★3秒間なにも変わらないのが「長い」の正体だった（実測 確定→トップ 3.3秒／
       うち3.0秒は固定待ち・通信は1.1〜1.4秒）。★押した手ごたえを先に出す。 -->
<section id="screen-thanks" class="screen">
  <div class="thanks-mark">✓</div>
  <div class="screen-title">ありがとうございました</div>
</section>

<!-- 本日の一覧（ダイアログ）。★入力画面とは独立。開いている間は入力操作をしない -->
<div id="list-overlay" class="list-overlay" hidden>
  <div class="list-panel" role="dialog" aria-modal="true" aria-label="本日の一覧">
    <div class="list-head">
      <div class="list-title">本日の一覧</div>
      <button id="btn-list-close" type="button" class="list-close" aria-label="閉じる">✕</button>
    </div>
    <div id="list-body" class="list-body">読み込み中…</div>
  </div>
</div>

<!-- ★2026-09-15 下の5本を ★ここへ埋め込みました（司令承認）。
     ★理由：★1本でも取得に失敗すると、★3本は『画面は正常に見えるが中身が無い』、
     ★2本は『真っ白』になる。★外から読むのをやめれば ★原因によらず起きない。
     ★元ファイルは残置。★編集はそちらで行い scratchpad/inline_js.py で貼り直す。
     ★読み込み順は ★元のまま（依存があるため変えない）： menu.config.js → menu.logic.js → ui.flags.js → submit.js → app.js
-->
<!-- ▼ menu.config.js  sha256:c23148f29b32602b -->
<script>
/*
 * RISE南関町 来店記録タブレット — メニュー・料金 定義ファイル
 *
 * ★このファイルが唯一の料金マスタです。10/1 の値段改定時は、このファイル内の
 *   price / kariPrice の数値だけを書き換えてください。画面(HTML/CSS/JS)は一切
 *   触る必要がありません。
 *
 * 有効期間: 2026-08-09 〜 2026-09-30（現行価格）
 * ★2026-10-01 から値段改定の予定（2026-08-09時点で改定内容は未定）。
 *   改定が来たら effective.from / effective.to と各 price を書き換えること。
 *
 * 出典: 20260808_来店記録タブレット化_計画_大神.md §実物のメニュー表
 *       （2026-08-09 司令が現地で撮影・受領 msg 1535914594772590612）
 *
 * ★2026-08-10 司令が男性CUTの表示名を書き換え（msg 1536186655256354898・画像で指定）。
 *   店頭メニュー表の名称は「調髪」等のままなので、officialName に元の名称を残してある。
 *   name(画面表示) と officialName(店頭メニュー表) は別物として扱うこと。
 *   ★この書き換えで「調髪＝カット＋シャンプー＋顔剃り」「子供調髪＝子供カット＋シャンプー
 *     （顔剃りは含まない）」が確定した。旧5区分への寄せ表はこれに従う。
 *
 * ★2026-08-10 「ロング増し」を単独メニューから加算方式へ変更（司令指示 msg 1536189024287334431）。
 *   司令の言葉:「女性→カット→ロング増しだけど、これはパーマとカラーにかかってくる料金だね。
 *   カットは関係ない」
 *   旧実装は woman-cut-longmashi（ロング増し）と woman-perma-permalongmashi（パーマロング増し）
 *   を「単独メニュー」として一覧に並べており、お客様がそれだけをタップして600円で確定できて
 *   しまう誤りがあった。この2項目を削除し、代わりに女性 COLOR 全4項目・PERMA 全2項目
 *   （フェイスラインパーマ／パーマ）に加算フラグ hasLong / longAddPrice を付与する方式へ変更。
 *   ★店頭メニュー表には「ロング増し」「パーマロング増し」が今も別項目として印刷されているが、
 *   実態はどちらも同じ600円の加算であり、画面上は各メニュー選択後の画面4c（髪の長さは？）で
 *   「長い（＋600円）」を選ぶことで同じ600円が加算される。男性・女性のカット系（CUT区分）
 *   には一切付けない（司令明示「カットは関係ない」）。
 *
 * データ構造:
 *   id           : 一意キー（gas送信・検証スクリプトで使用）
 *   name         : 画面に表示するメニュー名（お客様が読む文言）
 *   officialName : 店頭メニュー表の名称。name と異なる項目にのみ付与（集計・突合用）
 *   price        : 円（丸刈り価格を持つ項目は「通常」側の価格。ロング加算は含まない基準額）
 *   hasKari      : true の場合、選択後に画面4b（ふつう／丸刈り）を挟む
 *   kariPrice    : 丸刈り選択時の価格（hasKari が false の項目は null）
 *   hasLong      : true の場合、選択後に画面4c（ふつう／長い）を挟み、「長い」選択時に
 *                  longAddPrice を price に加算する
 *   longAddPrice : 「長い」選択時に price へ加算する金額（hasLong が false の項目は null）
 *   isMinimum    : true の場合、表記が「〜」付きで下限値を記録していることを示す
 *                  （フェイスラインパーマ／パーマ(女性) の2項目のみ true。ロング加算後も維持）
 *
 * 丸刈り価格を持つのは MEN'S CUT の3項目のみ（店頭表記→画面表示）:
 *   カットシャンプー   → カットとシャンプー(1,950 / 丸刈り1,700)
 *   カットシェービング → カットと顔剃り(1,950 / 丸刈り1,700)
 *   調髪             → カットとシャンプーと顔剃り(2,200 / 丸刈り1,950)
 *

      if (list.length > 200) list = list.slice(-200); // 端末の容量を圧迫しない

    } catch (e) { /* 保存に失敗しても画面は止めない */ }
  }

  /**
   * 1件送信する。失敗した場合はキューへ積んで後で再送する（例外は投げない＝画面は止めない）。
   */
  function submitRecord(record) {
    return sendOne(record).then(function (r) {
      if (r.kind === "sent") return r;
      if (r.kind === "rejected") { keepRejected(record, r.reason); return r; }
      enqueue(record); // retry
      return r;

  /**
   * 未送信キューの再送を試みる。呼び出しごとに全件試行し、成功したものだけキューから外す。

    var queue = loadQueue();
    if (queue.length === 0) return Promise.resolve({ attempted: 0, succeeded: 0 });
    var remaining = [];
    var succeeded = 0;
    var rejected = 0;
    var attempts = queue.map(function (record) {
      return sendOne(record).then(function (r) {
        if (r.kind === "sent") { succeeded++; return; }
        if (r.kind === "rejected") { keepRejected(record, r.reason); rejected++; return; }

        if (record._tries >= MAX_RETRIES) { keepRejected(record, "gave_up:" + r.reason); rejected++; return; }

      saveQueue(remaining);
      return { attempted: queue.length, succeeded: succeeded, rejected: rejected };

   * ★数えるのはサーバ（GAS）1か所だけ。端末では数え直さない。

    if (!token) return Promise.resolve({ ok: false, reason: "no_token" });
    return fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ action: "today", token: token })
    }).then(function (res) {
      if (!res.ok) return { ok: false, reason: "http_" + res.status };
      return res.text().then(function (t) {
        var body = null;
        try { body = JSON.parse(t); } catch (e) { /* 読めなければ失敗扱い */ }
        if (!body) return { ok: false, reason: "unreadable" };
        // ★受け口が返した理由をそのまま持ち帰る。
        //   特に "no_record_id" は「受け口が action:today を知らない＝公開版が古い」印。
        //   この時、受け口側は拒否ログに1行書くので、呼び続けるとログが溜まる。

      });
    }).catch(function (e) {
      return { ok: false, reason: "network:" + (e && e.message ? e.message : "error") };
    });
  }

  /**
   * 本日の一覧（司令 2026-08-16・レジとの突合用）。
   * ★並べ替えも時刻の整形もサーバ側でやってもらう。端末では加工しない。
   *   受信日時はシート上で 0埋めが落ちるため、端末で解釈すると午前10時以降に狂う。
   */
  function fetchTodayList() {
    var token = getToken();
    if (!token) return Promise.resolve({ ok: false, reason: "no_token" });
    return fetch(SUBMIT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify({ action: "today_list", token: token })
    }).then(function (res) {
      if (!res.ok) return { ok: false, reason: "http_" + res.status };
      return res.text().then(function (t) {
        var body = null;
        try { body = JSON.parse(t); } catch (e) { /* 読めなければ失敗扱い */ }
        if (!body) return { ok: false, reason: "unreadable" };
        if (body.ok !== true) return { ok: false, reason: "server", msg: String(body.msg || "") };
        return body;
      });
    }).catch(function (e) {
      return { ok: false, reason: "network:" + (e && e.message ? e.message : "error") };
    });
  }

  /** まだ送れていない件数。★サーバは知りようがない＝端末だけが持つ情報 */
  function pendingCount() {
    try { return loadQueue().length; } catch (e) { return 0; }
  }

  /**
   * 端末のタイムゾーン設定に関係なく JST(+09:00) の ISO 8601 文字列を返す。
   * 記録要件「日時（ISO・JST）」に対応（計画書 §送信部）。
   */
  function toJstIsoString(date) {
    var jstMs = date.getTime() + 9 * 60 * 60 * 1000; // UTCミリ秒 + 9時間
    var jst = new Date(jstMs);
    var pad = function (n, len) {
      len = len || 2;
      var s = String(n);
      while (s.length < len) s = "0" + s;
      return s;

    return (
      jst.getUTCFullYear() + "-" + pad(jst.getUTCMonth() + 1) + "-" + pad(jst.getUTCDate()) +
      "T" + pad(jst.getUTCHours()) + ":" + pad(jst.getUTCMinutes()) + ":" + pad(jst.getUTCSeconds()) +
      "." + pad(jst.getUTCMilliseconds(), 3) + "+09:00"
    );
  }

   * 1レコードに一意のIDを振る。
   * ★再送キューに積まれた後も同じIDのまま送り直されるため、受け口側は
   *   「同じ record_id が既にあればスキップ」で二重計上を防げる。
   *   ここで毎回振り直すと、通信が不安定な日に件数が水増しされる。
   */
  function newRecordId() {
    try {
      if (root.crypto && typeof root.crypto.randomUUID === "function") {
        return root.crypto.randomUUID();
      }
    } catch (e) {
      /* 古い端末では下のフォールバックへ */
    }
    // フォールバック: 時刻 + 乱数。端末1台・1秒に1件未満の運用では十分に衝突しない。
    return "r-" + Date.now().toString(36) + "-" +
      Math.floor(Math.random() * 1e12).toString(36);
  }

  /**
   * ★1回の来店で複数メニューを選べるようにするための組み立て（2026-09-14 司令ご依頼）。
   *
   * ★症状: カットとカラーを両方選べず、分けて入れると ★2人分に数えられていた
   *        （受け口側が「来店客数 = 行数」で数えているため。gas/Code.gs:92）。
   * ★方針(案B): 明細の形は変えず、★同じ来店の行に同じ visit_id を持たせる。

   *        → 明細1行=1メニュー のままなので、売上・メニュー別集計は今までどおり動く。
   *
   * ★受け口が visit_id 列を持つまでは、送っても ★黙って捨てられる（拒否はされない。
   *   検証済み: gas/Code_production.gs:86-87 が見るのは record_id と menu_id だけ）。
   *   ★そのため「画面だけ先に本番へ出す」ことはしない。出すと ★2人と数えられる行が
   *   実際に作れるようになり、★いまより悪くなる。マリアの列追加と同時に上げる。
   */
  function buildRecords(state, cart) {
    var visitId = newRecordId();
    var list = (cart && cart.length) ? cart : [state];
    return list.map(function (sel, i) {
      var r = buildRecord(sel);
      r.visit_id = visitId;        // ★同じ来店＝同じ値
      r.visit_seq = i + 1;         // 何番目のメニューか（1始まり）
      r.visit_size = list.length;  // その来店で選ばれたメニューの数
      return r;
    });
  }

  function buildRecord(state) {
    var now = new Date();
    return {
      record_id: newRecordId(), // ★受け口側の重複排除キー
      token: getToken(), // ★端末登録トークン。未登録なら空＝受け口が拒否する
      mode: getMode(), // "test"（既定・試験タブ）/ "live"（本番タブ）
      device: getDevice(), // 端末の識別名（判定には使わない・後から追う用）
      timestamp_iso: toJstIsoString(now), // JST固定（端末のタイムゾーン設定に非依存）
      visit_type: state.visitType, // "first" | "repeat"
      gender: state.gender, // "MEN" | "WOMAN"
      section: state.section, // "CUT" | "COLOR" | "PERMA"
      menu_id: state.item.id, // ★受け口側が料金表と突き合わせるキー
      menu_name: state.item.name,
      kari_applied: !!state.kariApplied, // 丸刈り選択の有無
      long_applied: !!state.longApplied, // ロング加算（旧「ロング増し」「パーマロング増し」相当）選択の有無
      long_add_price: state.longApplied ? (state.longAddPrice || 0) : 0, // ロング加算額（未選択時は0）
      price: state.price, // ★丸刈り・ロング加算を反映した最終金額
      is_minimum: !!state.isMinimum // 「〜」表記の下限値で記録した場合 true
    };

  // ページ読み込み時に、ハッシュにトークンがあれば登録して即座にURLから消す
  try { registerFromHash(); } catch (e) { /* 画面は止めない */ }

  // ★既に開いている画面のURL末尾に #t=… を足しただけの場合、ページは再読み込みされず
  //   上の初期化は走らない。hashchange でも拾う（登録できずに全件拒否される事故を防ぐ）。
  try {
    if (root.addEventListener) {
      root.addEventListener("hashchange", function () {
        try { registerFromHash(); } catch (e) { /* 画面は止めない */ }
      });
    }
  } catch (e) { /* 画面は止めない */ }

  var RISE_SUBMIT = {
    SUBMIT_URL: SUBMIT_URL,
    registerFromHash: registerFromHash,
    getToken: getToken,
    getDevice: getDevice,
    getMode: getMode,
    submitRecord: submitRecord,
    retryPending: retryPending,
    fetchToday: fetchToday,
    fetchTodayList: fetchTodayList,
    pendingCount: pendingCount,
    buildRecord: buildRecord,
    buildRecords: buildRecords,
    toJstIsoString: toJstIsoString,
    _loadQueue: loadQueue, // テスト用
    listRejected: function () {
      try { return JSON.parse((root.localStorage && root.localStorage.getItem(REJECTED_KEY)) || "[]"); }
      catch (e) { return []; }
    }
  };

    module.exports = RISE_SUBMIT;
  } else {
    root.RISE_SUBMIT = RISE_SUBMIT;
  }
})(typeof self !== "undefined" ? self : this);

    var srvAmount = (data.amount === undefined) ? sum : Number(data.amount);
    html += '<div class="list-total">合計 ' + srvCount + " 人 ／ " +
      srvAmount.toLocaleString("ja-JP") + " 円</div>";
    if (srvCount !== rows.length || srvAmount !== sum) {
      html += '<div class="list-msg">合計と明細が一致しません（明細 ' + rows.length + " 人 ／ " +
        sum.toLocaleString("ja-JP") + " 円）</div>";
    }
    body.innerHTML = html;
  }

  function openTodayList() {
    var ov = document.getElementById("list-overlay");
    var body = document.getElementById("list-body");
    if (!ov || !body) return;
    ov.hidden = false;
    if (todayDisabled) {
      // 受け口が古いと分かっている間は叩かない（拒否ログを増やさない）
      body.innerHTML = '<div class="list-msg">' + esc(todayDisabledNote) + "</div>";
      return;
    }
    body.textContent = "読み込み中…";
    SUBMIT.fetchTodayList().then(renderTodayList).catch(function () { renderTodayList(null); });
  }

  function closeTodayList() {
    var ov = document.getElementById("list-overlay");
    if (ov) ov.hidden = true;
  }

  function goScreen2() {
    showOnly("s2");
  }

  function goScreen3() {
    showOnly("s3");
  }

  function renderScreen4() {
    var items = LOGIC.getItemsFor(CONFIG, state.gender, state.section);
    var container = document.getElementById("screen-4-buttons");
    container.innerHTML = "";
    items.forEach(function (item) {
      var btn = document.createElement("button");
      btn.className = "tap-btn menu-btn";
      btn.type = "button";
      btn.textContent = item.name;
      btn.addEventListener("click", function () {
        chooseItem(item);
      });
      container.appendChild(btn);
    });
    showOnly("s4");
  }

  function goScreen4b() {
    showOnly("s4b");
  }

  function goScreen4c() {
    showOnly("s4c");
  }

  // 画面4で項目を選んだ直後。画面4b(丸刈り)→画面4c(ロング加算) の順で判定する。
  // hasKari(男性CUT)とhasLong(女性COLOR/PERMA)は互いに排他だが、両方立った場合でも
  // 順序が固定されていれば壊れない構成にしてある。
  function chooseItem(item) {
    state.item = item;
    state.kariChoice = null;
    state.longChoice = null;
    proceedAfterKari();
  }

  function proceedAfterKari() {
    if (LOGIC.shouldShowScreen4b(state.item)) {
      goScreen4b();
      return;
    }
    proceedAfterLong();
  }

  function proceedAfterLong() {
    if (LOGIC.shouldShowScreen4c(state.item)) {
      goScreen4c();
      return;
    }
    finalizePrice();
  }

  function finalizePrice() {
    var resolved = LOGIC.resolvePrice(state.item, state.kariChoice, state.longChoice);
    state.price = resolved.price;
    state.isMinimum = resolved.isMinimum;
    state.kariApplied = resolved.kariApplied;
    state.longApplied = resolved.longApplied;
    state.longAddPrice = resolved.longApplied ? state.item.longAddPrice : 0;
    renderScreen5();
  }

  function renderScreen5() {
    // ★2つ以上選ばれている時だけ内訳を出す。1つの時は今までの見た目のまま
    //   （毎回リストが出ると、★1メニューのお客様の操作感が変わってしまう）。
    // ★受け口(GAS)が visit_id で数えるようになるまで、ボタンは出さない。
    //   出したまま使われると、★1人が2メニュー選んだ日だけ客数が水増しされる。
    document.getElementById("btn-add-menu").hidden = !FLAGS.MULTI_MENU_ENABLED;

    var list = document.getElementById("screen-5-items");
    var picked = cart.concat([snapshotSelection()]);
    if (picked.length > 1) {
      list.innerHTML = "";
      picked.forEach(function (s) {
        var li = document.createElement("li");
        li.className = "picked-item";
        li.textContent = s.item.name + "　" + (s.price || 0).toLocaleString("ja-JP") + " 円";
        list.appendChild(li);
      });
      list.hidden = false;
    } else {
      list.hidden = true;
      list.innerHTML = "";
    }
    document.getElementById("screen-5-price").textContent =
      cartTotal().toLocaleString("ja-JP") + " 円です";
    showOnly("s5");
  }

  /**
   * 「他のメニューを追加」。いまの選択を積んで、画面3（ご希望）へ戻る。
   * ★ご来店・性別は保持する（同じお客様なので聞き直さない）。
   * ★積んだ分は cart に入るので、画面5の合計と確定時の送信に必ず含まれる。
   */
  function addAnotherMenu() {
    cart.push(snapshotSelection());
    // 1メニューぶんの選択だけを初期化する（visitType / gender は残す）
    state.section = null;
    state.item = null;
    state.kariChoice = null;
    state.longChoice = null;
    state.kariApplied = false;
    state.longApplied = false;
    state.longAddPrice = 0;
    state.price = null;
    state.isMinimum = false;
    goScreen3();
  }

  function confirmAndSubmit() {
    var confirmBtn = document.getElementById("btn-confirm");
    confirmBtn.disabled = true;

    // ★2026-09-14: 1回の来店ぶん（cart + 選択中）をまとめて組み立てる。
    //   同じ visit_id が入るので、受け口側は ★何行あっても1人として数えられる。
    var records = SUBMIT.buildRecords(state, cart.concat([snapshotSelection()]));
    // ★送信の完了を待ってから画面1へ戻す。待たずに戻すと、上部の帯が
    //   「1件前」の数字を取りに行き、押した直後だけ数が合わないように見える。
    //   ★1件でも失敗したら残りも送る（1つの失敗で他を巻き込まない）。
    //   ★2026-09-14: この「待つ」は下で ★待たない形に変えた（理由は下のコメント）。
    showOnly("thanks");          // ★押した手ごたえを ★先に返す
    var sent = Promise.all(records.map(function (r) {
      return SUBMIT.submitRecord(r).catch(function () { /* 画面は止めない */ });
    }));
    SUBMIT.retryPending(); // ついでに未送信キューの再送も試みる

    // ★★2026-09-14（司令ご依頼「確定してからトップに戻るまでが異様に長い」）
    //   実測: 確定→トップ ★3.3秒 ／ うち ★3.0秒 が固定待ち ／ 通信は 1.1〜1.4秒
    //   ＝ ★待ちのほうが通信より長い。しかも ★その間 画面が何も変わらないので、
    //     実際の3秒より長く感じる（★押した手ごたえが無い）。
    //   → ① ★押した瞬間に「ありがとうございました」を出す（上の showOnly("thanks")）
    //     ② ★送信の完了を待たずに戻る（送信は裏で続く）
    //     ③ ★送信が終わってから 帯を取り直す
    //        旧実装が送信を待っていたのは、★帯が「1件前」の数字を出さないため。
    //        ★待つ代わりに あとで取り直せば、★同じ目的を 待たずに満たせる。
    //   ★取りこぼしは起きない: 失敗分は submitRecord がキューへ積み、次回 retryPending が送る。
    sent.then(function () {
      if (screens.s1.classList.contains("active")) refreshTodayBar();
    });

    setTimeout(function () {
      confirmBtn.disabled = false;
      goScreen1();
    }, FLAGS.AUTO_RETURN_MS);
  }

  // ---- イベント登録 ----

  document.getElementById("btn-first").addEventListener("click", function () {
    state.visitType = "first";
    goScreen2();
  });
  document.getElementById("btn-repeat").addEventListener("click", function () {
    state.visitType = "repeat";
    goScreen2();
  });

  document.getElementById("btn-men").addEventListener("click", function () {
    state.gender = "MEN";
    goScreen3();
  });
  document.getElementById("btn-woman").addEventListener("click", function () {
    state.gender = "WOMAN";
    goScreen3();
  });

  ["CUT", "COLOR", "PERMA"].forEach(function (sectionKey) {
    document.getElementById("btn-section-" + sectionKey.toLowerCase()).addEventListener("click", function () {
      state.section = sectionKey;
      var items = LOGIC.getItemsFor(CONFIG, state.gender, state.section);
      if (LOGIC.shouldShowScreen4(CONFIG, FLAGS, state.gender, state.section)) {
        renderScreen4();
      } else {
        // 1択かつスキップ設定＝画面4を飛ばして直接選択確定
        chooseItem(items[0]);
      }
    });
  });

  document.getElementById("btn-kari-normal").addEventListener("click", function () {
    state.kariChoice = "normal";
    proceedAfterLong();
  });
  document.getElementById("btn-kari-kari").addEventListener("click", function () {
    state.kariChoice = "kari";
    proceedAfterLong();
  });

  document.getElementById("btn-long-normal").addEventListener("click", function () {
    state.longChoice = "normal";
    finalizePrice();
  });
  document.getElementById("btn-long-long").addEventListener("click", function () {
    state.longChoice = "long";
    finalizePrice();
  });

  document.getElementById("btn-confirm").addEventListener("click", confirmAndSubmit);
  document.getElementById("btn-add-menu").addEventListener("click", addAnotherMenu);

  // 本日の一覧（開く／閉じる）
  document.getElementById("btn-today-list").addEventListener("click", openTodayList);
  document.getElementById("btn-list-close").addEventListener("click", closeTodayList);
  // ★暗い部分を押しても閉じる（バツを探せない時の逃げ道）。中身を押した時は閉じない。
  document.getElementById("list-overlay").addEventListener("click", function (e) {
    if (e.target === this) closeTodayList();
  });

  // 起動時に未送信キューがあれば再送を試みる（Wi-Fi復帰後などを想定）
  SUBMIT.retryPending();

  goScreen1();
})();

</script>
</body>
</html>
